<style>

<three-d-stage name="lamp" background="#ebe2cb"></three-d-stage>

<script src="three-d-stage.js"></script>
<script type="module">
const stage=document.querySelector('three-d-stage');
const {THREE}=await stage.ready;
const Q=new URLSearchParams(location.search);
const embed=Q.get('embed')==='1';
let view=Q.get('view')||'iso';
const pose=Q.get('pose')||'attentive';
if(embed){stage.shadowRoot.querySelectorAll('.toolbar,.note').forEach(e=>e.style.display='none');document.getElementById('bar').style.display='none';}
const M=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??0.55,metalness:o.m??0});if(o.e){m.emissive=new THREE.Color(o.e);m.emissiveIntensity=o.ei??1;}m.name=name;return m;};
const mat={
 shell:M('PLA_cream',0xefe3c8,{r:0.42}),
 teal:M('PLA_seafoam',0x5ea49b,{r:0.42}),
 tealDeep:M('PLA_seafoam_paint',0x3f7d76,{r:0.5}),
 red:M('signal_red',0xc8463a,{r:0.38}),
 chrome:M('chrome_trim',0xdfe2e4,{r:0.2,m:0.35}),
 alu:M('brushed_alu_finish',0xc9cdd0,{r:0.34,m:0.45}),
 brass:M('brass_finish',0xc29a48,{r:0.3,m:0.55}),
 cf:M('PLA_structural',0x323438,{r:0.72}),
 servo15:M('STS3215_black',0x232427,{r:0.5}),
 steel:M('steel',0xbfc3c7,{r:0.22,m:0.4}),
 tpu:M('TPU_foot',0xb83e33,{r:0.85}),
 glass:M('display_glass',0x163638,{r:0.12,e:0x0c2a2a,ei:0.7}),
 glow:M('eye_glow',0xa8f7ea,{e:0x7ff0dc,ei:1.5}),
 batt:M('lipo_wrap',0x37598a,{r:0.6}),
 pcb:M('pcb_green',0x2e6a46,{r:0.6}),
 pcb2:M('pcb_purple',0x6a3f8e,{r:0.6}),
 wire:M('bus_wire',0x2a2a2a,{r:0.7}),
 power:M('power_wire',0xc23a2f,{r:0.6}),
 shelf:M('shelf_context',0xb9b2a2,{r:0.8}),
};
for(const k of ['shell','teal','tealDeep'])mat[k].side=THREE.DoubleSide;
mat.shelf.transparent=true;mat.shelf.opacity=0.45;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(p,name,geo,m,pos=[0,0,0],rot=[0,0,0],sc){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(...pos);o.rotation.set(...rot);if(sc)o.scale.set(...sc);p.add(o);return o;}
function G(p,name,o={}){const g=new THREE.Group();g.name=name;if(o.pos)g.position.set(...o.pos);g.userData={label:o.label,ex:o.ex,base:g.position.clone()};p.add(g);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CZ=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateX(Math.PI/2);
const CX=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateZ(Math.PI/2);
const CY=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s);
const lx=(o,t)=>{o.userData.lx=t;return o;};
const tube=(p,n,pts,m,r=0.0015)=>add(p,n,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(q=>V(...q))),48,r,8),m);
function rr(s,hw,hh,r){s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function halfShell(sign){const w=0.034,h=0.036,r=0.026,s=new THREE.Shape();
 if(sign>0){s.moveTo(0,-h);s.lineTo(w-r,-h);s.absarc(w-r,-h+r,r,-Math.PI/2,0,false);s.lineTo(w,h-r);s.absarc(w-r,h-r,r,0,Math.PI/2,false);s.lineTo(0,h);s.lineTo(0,-h);}
 else{s.moveTo(0,h);s.lineTo(-(w-r),h);s.absarc(-(w-r),h-r,r,Math.PI/2,Math.PI,false);s.lineTo(-w,-h+r);s.absarc(-(w-r),-h+r,r,Math.PI,Math.PI*1.5,false);s.lineTo(0,-h);s.lineTo(0,h);}
 const g=new THREE.ExtrudeGeometry(s,{depth:0.08,bevelEnabled:true,bevelThickness:0.008,bevelSize:0.008,bevelSegments:6,curveSegments:24});g.translate(0,0,-0.04);return g;}
const lathe=pts=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),96);

const model=new THREE.Group();model.name='Lamp';
const D=Math.PI/180;
const POSES={attentive:{yaw:0,t1:15,t2:95,psi:35},lean:{yaw:0,t1:55,t2:92,psi:25},peek:{yaw:32,t1:30,t2:70,psi:8},asleep:{yaw:0,t1:-15,t2:140,psi:60}};
const P=POSES[pose]||POSES.attentive;
const L1=0.16,L2=0.16,RC=0.022;
mat.led=M('led_ring_2700K',0xffe6bc,{e:0xffc070,ei:pose==='asleep'?0.35:2.2});
mat.springM=M('spring_steel_brass',0xc29a48,{r:0.28,m:0.6});
class Helix extends THREE.Curve{constructor(L,r,n){super();this.L=L;this.r=r;this.n=n;}getPoint(t,o=new THREE.Vector3()){const q=t*this.n*Math.PI*2;return o.set(this.r*Math.cos(q),t*this.L,this.r*Math.sin(q));}}
function orient(o,A,B){const d=B.clone().sub(A);o.position.copy(A);o.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());return d.length();}
function spring(p,n,A,B){const g=new THREE.Group();g.name=n;p.add(g);const L=orient(g,A,B);const c=0.008;
 add(g,'coil',new THREE.TubeGeometry(new Helix(L-2*c,0.0042,Math.round((L-2*c)/0.0016)),Math.round((L-2*c)/0.0016)*10,0.0007,6),mat.springM,[0,c,0]);
 add(g,'hook_a',CY(0.0008,c,8),mat.springM,[0,c/2,0]);add(g,'hook_b',CY(0.0008,c,8),mat.springM,[0,L-c/2,0]);return g;}
function rod(p,n,A,B,r,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,16),m);o.name=n;const L=orient(o,A,B);o.geometry.translate(0,0.5,0);o.scale.set(1,L,1);p.add(o);return o;}

// ---------- base (fixed) ----------
const base=G(model,'base');
const foot=G(base,'tpu_foot',{label:'TPU foot · stretch-fit, hides 8× M3',ex:[0,-0.16,0]});
add(foot,'foot',CY(0.087,0.004,96),mat.tpu,[0,0.002,0]);
const floor=G(base,'base_floor',{label:'Base floor · PLA, insert bosses',ex:[0,-0.12,0]});
add(floor,'floor',CY(0.084,0.003,96),mat.tealDeep,[0,0.0055,0]);
const disc=G(base,'steel_disc',{label:'Steel ballast ring Ø150 / Ø90 · M4 ×4',ex:[0,-0.085,0]});
lx(add(disc,'steel_ring',new THREE.RingGeometry(0.045,0.075,72).rotateX(-Math.PI/2),mat.steel,[0,0.021,0]),'Steel ballast ring Ø150 / Ø90');add(disc,'ring_wall_o',new THREE.CylinderGeometry(0.075,0.075,0.014,72,1,true),mat.steel,[0,0.014,0]);add(disc,'ring_wall_i',new THREE.CylinderGeometry(0.045,0.045,0.014,72,1,true),mat.steel,[0,0.014,0]);
const shell=G(base,'base_shell',{label:'Base shell · PLA sea foam, chrome band',ex:[0,-0.035,0]});
add(shell,'shell',lathe([[0.082,0.007],[0.086,0.011],[0.086,0.046],[0.08,0.054],[0.044,0.056],[0.036,0.056]]),mat.teal);
add(shell,'band',new THREE.CylinderGeometry(0.0866,0.0866,0.006,96,1,true),mat.chrome,[0,0.034,0]);
for(let i=0;i<4;i++)add(shell,'grille_slot',BX(0.002,0.0018,0.026),mat.chrome,[0.0862,0.012+i*0.0035,0]);
add(shell,'usbc_bezel',BX(0.004,0.008,0.015),mat.chrome,[-0.0862,0.016,0]);
add(shell,'usbc_port',BX(0.003,0.0034,0.0092),mat.servo15,[-0.0876,0.016,0]);
add(shell,'switch_base',CX(0.0045,0.004,20),mat.chrome,[-0.0862,0.016,-0.034]);
add(shell,'switch_lever',new THREE.CylinderGeometry(0.0013,0.0018,0.014,10),mat.brass,[-0.091,0.021,-0.034],[0,0,0.9]);
add(shell,'top_ring',new THREE.TorusGeometry(0.036,0.0016,10,64).rotateX(Math.PI/2),mat.chrome,[0,0.056,0]);
const brg=G(base,'brg_6810',{label:'6810 thin-section bearing · yaw, takes arm moment',ex:[0,0.035,0]});
add(brg,'brg_6810',new THREE.TorusGeometry(0.0295,0.0035,12,64).rotateX(Math.PI/2),mat.steel,[0,0.0525,0]);
const yawServo=G(base,'yaw_servo',{label:'STS3215 · base yaw · ID 1',ex:[0,0.005,0]});
lx(add(yawServo,'yaw_case',BX(0.045,0.035,0.024),mat.servo15,[0.011,0.0245,0]),'STS3215 · yaw · ID 1, floor U-frame');
const PIN=G(base,'base_internals');
add(PIN,'tray',BX(0.11,0.002,0.11),mat.cf,[-0.01,0.0155,0]);
lx(add(PIN,'pi_zero_2w',BX(0.065,0.004,0.03),mat.pcb,[-0.032,0.019,0.04]),'Pi Zero 2 W · face, mics, audio');
lx(add(PIN,'esp32_s3',BX(0.063,0.004,0.028),mat.pcb,[-0.032,0.019,-0.04]),'ESP32-S3 N16R8 · reflex brain');
lx(add(PIN,'bus_adapter',BX(0.04,0.004,0.025),mat.pcb,[0.042,0.019,-0.042]),'Servo bus adapter');
lx(add(PIN,'buck_12v',BX(0.022,0.008,0.017),mat.servo15,[0.04,0.021,0.046]),'12 V / 5 A buck · servos');
lx(add(PIN,'buck_5v',BX(0.022,0.008,0.017),mat.servo15,[0.0,0.021,0.064]),'5 V / 5 A buck · logic');
lx(add(PIN,'pd_sink',BX(0.012,0.003,0.014),mat.pcb2,[-0.074,0.018,0]),'USB-C PD sink · 15 V');
lx(add(PIN,'led_driver',BX(0.012,0.003,0.016),mat.pcb2,[0.0,0.018,-0.066]),'LED driver · constant current');
add(PIN,'efuse',BX(0.01,0.003,0.01),mat.pcb2,[0.06,0.018,-0.02]);
lx(add(PIN,'amp',BX(0.018,0.003,0.018),mat.pcb2,[0.054,0.018,0.018]),'MAX98357A amp');
lx(add(PIN,'speaker',CX(0.014,0.006,32),mat.servo15,[0.075,0.021,0]),'Ø28 speaker · front grille');
lx(add(PIN,'cable_clock',new THREE.TorusGeometry(0.02,0.0017,8,48).rotateX(Math.PI/2),mat.power,[0,0.043,0]),'Cable clock · 1.25 turns');
add(PIN,'cable_clock2',new THREE.TorusGeometry(0.017,0.0017,8,48).rotateX(Math.PI/2),mat.power,[0,0.0405,0]);
tube(PIN,'usb_lead',[[-0.084,0.016,0],[-0.078,0.017,-0.004],[-0.074,0.018,0]],mat.power,0.0012);
tube(PIN,'pwr_bus',[[-0.07,0.019,0],[-0.03,0.022,0.012],[0.03,0.022,0.04],[0.04,0.022,0.046]],mat.power,0.0016);
tube(PIN,'harness_base',[[-0.01,0.022,0.03],[0.0,0.03,0.014],[0.012,0.04,0.0]],mat.power,0.002);
tube(PIN,'spk_lead',[[0.054,0.019,0.018],[0.066,0.02,0.008],[0.072,0.021,0.0]],mat.wire,0.0009);

// ---------- yaw stage ----------
const yaw=G(model,'yaw_stage',{pos:[0,0.062,0],ex:[0,0.09,0]});
yaw.rotation.y=P.yaw*D;
const S=V(0,0.04,0);
const tur=G(yaw,'turret',{label:'Turret · PLA, brushed-alu finish, spring lugs',ex:[0,-0.03,0]});
add(tur,'turret',lathe([[0.036,-0.004],[0.036,0.006],[0.03,0.016],[0.02,0.022],[0,0.022]]),mat.alu);
add(tur,'yaw_horn',CY(0.011,0.003),mat.chrome,[0,-0.0055,0]);
for(const z of [0.074,-0.08]){add(tur,'spring_lug',BX(0.012,0.008,0.006),mat.alu,[-0.032,0.012,z]);add(tur,'lug_arm',BX(0.006,0.006,Math.abs(z)-0.03),mat.alu,[-0.032,0.012,Math.sign(z)*(Math.abs(z)+0.03)/2]);}
const pod=G(yaw,'shoulder_pod',{label:'Shoulder pod · PLA cream, holds ID 2 + ID 3',ex:[0,0.06,0]});
{const s=rr(new THREE.Shape(),0.031,0.019,0.016);const g=new THREE.ExtrudeGeometry(s,{depth:0.088,bevelEnabled:true,bevelThickness:0.006,bevelSize:0.006,bevelSegments:5,curveSegments:16});g.translate(-0.011,0,-0.044);add(pod,'pod',g,mat.shell,[S.x,S.y,0]);
 for(const z of [-0.0505,0.0505])add(pod,'pod_cap',CZ(0.015,0.002,40),mat.chrome,[0,S.y,z]);
 add(pod,'pod_stripe',BX(0.074,0.004,0.002),mat.red,[-0.011,S.y+0.008,0.0505]);add(pod,'pod_stripe',BX(0.074,0.004,0.002),mat.red,[-0.011,S.y+0.008,-0.0505]);}
const sA=G(yaw,'servo_shoulder',{label:'STS3215 · shoulder · ID 2',ex:[0,0.06,0.07]});
lx(add(sA,'shoulder_case',BX(0.045,0.024,0.035),mat.servo15,[-0.011,S.y,0.023]),'STS3215 · shoulder · ID 2');
add(sA,'shoulder_horn',CZ(0.011,0.003),mat.chrome,[0,S.y,0.0575]);
const sB=G(yaw,'servo_elbow',{label:'STS3215 · elbow drive · ID 3',ex:[0,0.06,-0.07]});
lx(add(sB,'elbow_case',BX(0.045,0.024,0.035),mat.servo15,[-0.011,S.y,-0.023]),'STS3215 · elbow drive · ID 3');
// pose maths in yaw frame (x forward, y up)
const u1=V(Math.sin(P.t1*D),Math.cos(P.t1*D),0),u2=V(Math.sin(P.t2*D),Math.cos(P.t2*D),0);
const E=S.clone().addScaledVector(u1,L1);
const C1=S.clone().addScaledVector(u2,-RC),C2=E.clone().addScaledVector(u2,-RC);
const crankS=G(yaw,'crank_shoulder',{label:'Drive crank · metal horn ID 3',ex:[0,0.06,-0.1]});
{const o=rod(crankS,'crank',V(S.x,S.y,-0.07),V(C1.x,C1.y,-0.07),0.0035,mat.chrome);add(crankS,'crank_hub',CZ(0.007,0.006),mat.chrome,[S.x,S.y,-0.066]);add(crankS,'crank_pin',CZ(0.0025,0.008),mat.brass,[C1.x,C1.y,-0.072]);}
const pr=G(yaw,'pushrod',{label:'Pushrod · Ø4 steel, ball-bearing rod ends',ex:[0,0.06,-0.13]});
rod(pr,'pushrod',V(C1.x,C1.y,-0.074),V(C2.x,C2.y,-0.074),0.002,mat.steel);
for(const c of [C1,C2])add(pr,'rod_end',CZ(0.0045,0.004,20),mat.chrome,[c.x,c.y,-0.074]);
const spA=G(yaw,'spring_A',{label:'Spring A · balances shoulder',ex:[0,0.06,0.1]});
spring(spA,'spring_A',V(S.x-0.032,S.y-0.028,0.074),S.clone().addScaledVector(u1,0.06).setZ(0.074));
add(spA,'spring_pin',CZ(0.002,0.016),mat.brass,S.clone().addScaledVector(u1,0.06).setZ(0.068).toArray());
const spB=G(yaw,'spring_B',{label:'Spring B · balances elbow via crank',ex:[0,0.06,-0.16]});
spring(spB,'spring_B',V(S.x-0.032,S.y-0.028,-0.08),V(C1.x,C1.y,-0.08));
// lower arm
const lower=G(yaw,'lower_arm',{pos:[S.x,S.y,0]});
lower.rotation.z=-P.t1*D;
const lrA=G(lower,'lower_rail_R',{label:'Lower arm rail · PLA, brushed-alu',ex:[0,0,0.03]});
const lrB=G(lower,'lower_rail_L',{label:'Lower arm rail · rides 6802 on crank hub',ex:[0,0,-0.03]});
for(const [g,z] of [[lrA,0.0605],[lrB,-0.0605]]){add(g,'rail',BX(0.011,L1,0.004),mat.alu,[0,L1/2,z]);add(g,'hub_low',CZ(0.0095,0.005,32),mat.alu,[0,0,z]);add(g,'hub_high',CZ(0.0095,0.005,32),mat.alu,[0,L1,z]);add(g,'cap',CZ(0.006,0.0025,24),mat.brass,[0,L1,z+Math.sign(z)*0.0035]);}
add(lrA,'cap_low',CZ(0.006,0.0025,24),mat.brass,[0,0,0.064]);
add(lower,'cross_tie',BX(0.006,0.006,0.117),mat.alu,[0,0.095,0]);
const hl=G(lower,'harness_lower',{label:'Head harness · 14c ribbon in braid',ex:[-0.03,0,0]});
const hp1=[[-0.002,-0.012,0],[-0.012,0.03,0],[-0.012,0.13,0],[-0.004,0.166,0]];
tube(hl,'harness',hp1,mat.power,0.003);tube(hl,'trace',hp1.map(p=>[p[0]-0.0006,p[1],p[2]+0.0028]),mat.shell,0.0008);
for(const y of [0.05,0.11])add(hl,'p_clip',new THREE.TorusGeometry(0.0042,0.0012,8,24).rotateX(Math.PI/2),mat.brass,[-0.012,y,0]);
// upper arm
const upper=G(lower,'upper_arm',{pos:[0,L1,0],ex:[0,0.05,0]});
upper.rotation.z=-(P.t2-P.t1)*D;
const ur=G(upper,'upper_rails',{label:'Upper arm rails · PLA, brushed-alu'});
for(const z of [0.0525,-0.0525]){add(ur,'rail',BX(0.01,L2,0.004),mat.alu,[0,L2/2,z]);add(ur,'hub',CZ(0.009,0.005,32),mat.alu,[0,0,z]);add(ur,'hub_head',CZ(0.009,0.005,32),mat.alu,[0,L2,z]);}
add(ur,'tie',BX(0.006,0.006,0.1),mat.alu,[0,0.06,0]);
const ec=G(upper,'elbow_crank',{label:'Elbow crank + 685ZZ ×2',ex:[0,0,-0.05]});
add(ec,'crank',BX(0.007,RC,0.004),mat.chrome,[0,-RC/2,-0.07]);add(ec,'hub',CZ(0.007,0.006),mat.chrome,[0,0,-0.066]);

const hu=G(upper,'harness_upper',{});

const VIEWS={

const ov=document.getElementById('ov'),ln=document.getElementById('ln');
const exGroups=[];model.traverse(o=>{if(o.userData&&o.userData.ex)exGroups.push(o);});
function apply(v){
 view=VIEWS[v]?v:'iso';const cfg=VIEWS[view],ex=view==='exploded',xr=view==='xray';
 for(const g of exGroups){g.position.copy(g.userData.base);if(ex)g.position.add(V(...g.userData.ex));}

 const box=new THREE.Box3();model.traverseVisible(o=>{if(o.isMesh&&o.name!=='shelf')box.expandByObject(o);});
 const c=box.getCenter(V()),dir=V(...cfg.dir).normalize(),fwd=dir.clone().negate();
 const right=V().crossVectors(fwd,Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0)).normalize(),up=V().crossVectors(right,fwd);
 camera.fov=cfg.fov;camera.up.copy(Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0));
 const tV=Math.tan(camera.fov*Math.PI/360),tH=tV*camera.aspect*(cfg.labels?Math.max(0.42,1-440/innerWidth):1);
 let d=0;for(let i=0;i<8;i++){const p=V(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).sub(c);const w=p.dot(dir);d=Math.max(d,w+Math.abs(p.dot(right))/tH,w+Math.abs(p.dot(up))/tV);}
 d*=(cfg.pad||1.12);
 camera.position.copy(c).addScaledVector(dir,d);camera.near=d/60;camera.far=d*30;camera.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 ov.innerHTML='';ln.innerHTML='';labels=[];

function layout(){
 if(labels.length){const W=innerWidth,Hh=innerHeight,cx=W/2;const pts=labels.map(L=>{const q=L.p.clone().project(camera);return {L,x:(q.x+1)/2*W,y:(1-q.y)/2*Hh};});
  let svg='';for(const side of [0,1]){const col=pts.filter(p=>(p.x>=cx)===!!side).sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=25;
   col.forEach(p=>{p.ly=Math.max(p.y,prev+gap);prev=p.ly;});const over=col.length?col[col.length-1].ly-(Hh-16):0;if(over>0)col.forEach(p=>p.ly-=over);
   col.forEach(p=>{const el=p.L.el,w=el.offsetWidth;if(side){el.style.right='12px';el.style.left='';}else{el.style.left='12px';el.style.right='';}el.style.top=p.ly+'px';
    const colX=side?W-12-w:12+w;const ex=side?colX-2:colX+2,el2=side?colX-14:colX+14;svg+=`<polyline points="${ex},${p.ly} ${el2},${p.ly} ${p.x},${p.y}" fill="none" stroke="#23292b" stroke-width="1.2"/><circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#c8463a" stroke="#23292b" stroke-width="1"/>`;});}
  ln.innerHTML=svg;}}
