<script type="module">
const stage=document.querySelector('three-d-stage');

const M=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??0.55,metalness:o.m??0});if(o.e){m.emissive=new THREE.Color(o.e);m.emissiveIntensity=o.ei??1;}m.name=name;return m;};
const mat={
 shell:M('PLA_cream',0xefe3c8,{r:0.42}),
 teal:M('PLA_seafoam',0x5ea49b,{r:0.42}),
 tealDeep:M('PLA_seafoam_deep',0x3f7d76,{r:0.46}),
 red:M('signal_red',0xc8463a,{r:0.38}),
 chrome:M('PLA_metallic_silver',0xc9ced2,{r:0.4,m:0.25}),
 alu:M('PLA_metallic_silver_alt',0xc4c9cd,{r:0.44,m:0.22}),
 brass:M('PLA_metallic_brass',0xbd9a45,{r:0.42,m:0.28}),
 cf:M('PLA_structural',0x323438,{r:0.72}),
 servo15:M('STS3215_black',0x232427,{r:0.5}),

 tpu:M('TPU_foot',0xb83e33,{r:0.85}),

};
for(const k of ['shell','teal','tealDeep'])mat[k].side=THREE.DoubleSide;

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(p,name,geo,m,pos=[0,0,0],rot=[0,0,0],sc){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(...pos);o.rotation.set(...rot);if(sc)o.scale.set(...sc);p.add(o);return o;}
function G(p,name,o={}){const g=new THREE.Group();g.name=name;if(o.pos)g.position.set(...o.pos);g.userData={label:o.label,ex:o.ex,base:g.position.clone()};p.add(g);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CZ=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateX(Math.PI/2);
const CX=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateZ(Math.PI/2);
const CY=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s);
const lx=(o,t)=>{o.userData.lx=t;return o;};

function rr(s,hw,hh,r){s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function halfShell(sign){const w=0.034,h=0.036,r=0.026,s=new THREE.Shape();
 if(sign>0){s.moveTo(0,-h);s.lineTo(w-r,-h);s.absarc(w-r,-h+r,r,-Math.PI/2,0,false);s.lineTo(w,h-r);s.absarc(w-r,h-r,r,0,Math.PI/2,false);s.lineTo(0,h);s.lineTo(0,-h);}
 else{s.moveTo(0,h);s.lineTo(-(w-r),h);s.absarc(-(w-r),h-r,r,Math.PI/2,Math.PI,false);s.lineTo(-w,-h+r);s.absarc(-(w-r),-h+r,r,Math.PI,Math.PI*1.5,false);s.lineTo(0,-h);s.lineTo(0,h);}
 const g=new THREE.ExtrudeGeometry(s,{depth:0.08,bevelEnabled:true,bevelThickness:0.008,bevelSize:0.008,bevelSegments:6,curveSegments:24});g.translate(0,0,-0.04);return g;}

function slabX(shape,depth,bev){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:6,curveSegments:24});g.translate(0,0,-depth/2);g.rotateY(Math.PI/2);return g;}

 for(let i=0;i<6;i++){const q=i/6*Math.PI*2;add(w,'hub_dimple',new THREE.SphereGeometry(0.0021,10,8),mat.chrome,[0.0172*Math.cos(q),AY+0.0172*Math.sin(q),sd*(WZ+0.0076)]);}}

for(const [sx,n] of [[1,'drop_front'],[-1,'drop_rear']]){const z=0.022*sx;add(lower,n+'_bezel',BX(0.003,0.006,0.012),mat.red,[sx*(FX-0.003),0.024,z],[0,0,sx*0.6]);add(lower,n+'_window',BX(0.002,0.0035,0.008),mat.glass,[sx*(FX-0.0018),0.0245,z],[0,0,sx*0.6]);}
add(lower,'lidar_bezel',BX(0.003,0.007,0.02),mat.chrome,[FX+0.0005,0.088,0]);
add(lower,'lidar_window',BX(0.002,0.004,0.014),mat.glass,[FX+0.0018,0.088,0]);
const trim=G(B,'trim');
add(trim,'band_low',bandRing(0.075,0.003),mat.chrome);

for(let i=0;i<5;i++)add(up,'grille_bar',BX(0.002,0.0016,0.03),mat.chrome,[FX+0.0006,0.099+i*0.0042,0]);

const door=G(B,'battery_door',{label:'Battery door · snap latch, high mount',ex:[-0.08,0,0]});
{const s=rr(new THREE.Shape(),0.022,0.026,0.006);const g=new THREE.ExtrudeGeometry(s,{depth:0.002,bevelEnabled:true,bevelThickness:0.0006,bevelSize:0.0006,bevelSegments:2});g.rotateY(-Math.PI/2);add(door,'door',g,mat.tealDeep,[-FX-0.0003,0.144,-0.006]);}
add(door,'latch',BX(0.003,0.004,0.01),mat.red,[-FX-0.0026,0.172,-0.006]);
const cb=G(B,'corner_bumpers',{label:'Corner bumpers ×2 · TPU 95A, snap',ex:[0,0.07,0]});
for(const sd of [-1,1])add(cb,'corner_bumper',new THREE.SphereGeometry(0.019,32,20),mat.bump,[0,0.181,sd*0.044],[0,0,0],[1.02,0.9,1]);
const ant=G(B,'antennae',{label:'Spring antennae ×2 · steel spring, TPU balls',ex:[0,0.1,0]});

for(const z of [-0.0068,0.0068]){add(face,'eye',new THREE.SphereGeometry(0.0054,24,16),mat.glow,[FX+0.0064,FY+0.001,z],[0,0,0],sl?[0.35,0.22,1]:[0.35,1.1,1]);if(!sl){add(face,'pupil',new THREE.SphereGeometry(0.0026,16,12),mat.servo15,[FX+0.0083,FY,z],[0,0,0],[0.35,1,1]);add(face,'glint',new THREE.SphereGeometry(0.0009,8,6),mat.ww,[FX+0.009,FY+0.0013,z+0.001]);}}

const cam=G(B,'camera',{label:'Camera hood · chrome, XIAO lens',ex:[0.07,0.03,0]});
add(cam,'cam_hood',new THREE.SphereGeometry(0.0066,24,16,0,Math.PI*2,0,Math.PI/2),mat.chrome,[FX-0.001,0.18,0],[0,0,-Math.PI/2]);
add(cam,'cam_lens',CX(0.0027,0.002,24),mat.glass,[FX+0.0055,0.18,0]);
for(const sd of [1,-1]){const L=0.047,ang=(PO.legs?(sd>0?-33.7:213.7):90)*D;
 const lg=G(B,sd>0?'leg_front':'leg_rear',{label:sd>0?'Kickstand legs ×2 · PLA, TPU feet, over-centre lock':null,pos:[sd*0.036,0.03,0],ex:[sd*0.05,-0.02,0]});
 lg.rotation.z=ang;
 add(lg,'strut',new THREE.BoxGeometry(L,0.004,0.014).translate(L/2,0,0),mat.alu);
 add(lg,'strut_stripe',new THREE.BoxGeometry(L*0.7,0.0006,0.003).translate(L*0.45,0.0023,0),mat.red);
 add(lg,'foot',new THREE.SphereGeometry(0.0048,16,12),mat.bump,[L,0,0],[0,0,0],[1,1,1.6]);
 add(lg,'hinge_pin',CZ(0.0034,0.018,20),mat.brass);}

{const hp=[0.085,0.1,0.12,0.14,0.158,0.172].map((y,i)=>[-FX-0.0035,y,0.034+Math.sin(i*1.1)*0.002]);tube(hr,'harness',hp,mat.power,0.0026);tube(hr,'trace',hp.map(p=>[p[0]-0.0024,p[1],p[2]]),mat.shell,0.0007);
 for(const y of [0.105,0.148])add(hr,'p_clip',new THREE.TorusGeometry(0.0037,0.001,8,24).rotateX(Math.PI/2),mat.brass,[-FX-0.0035,y,0.034]);
 for(const y of [0.085,0.172])add(hr,'grommet',new THREE.TorusGeometry(0.0034,0.0012,8,24).rotateY(Math.PI/2),mat.servo15,[-FX-0.0005,y,0.034]);}
const blk=G(B,'motor_block',{label:'Motor block · PLA, IMU bracket on axle line',ex:[0,-0.028,0]});
add(blk,'block_plate',BX(0.02,0.003,0.108),mat.cf,[0,0.0245,0]);
for(const sd of [-1,1])add(blk,'strap',BX(0.014,0.0025,0.01),mat.cf,[0,AY+0.0065,sd*0.05]);
for(const sd of [-1,1]){const m=G(B,sd>0?'motor_R':'motor_L',{label:sd>0?'N20 gearmotors + hall encoders ×2':null,ex:[0,0,sd*0.026]});

 add(m,'motor_can',CZ(0.006,0.015,24),mat.steel,[0,AY,sd*0.0375]);

 add(m,'shaft',CZ(0.0015,0.012,12),mat.steel,[0,AY,sd*0.06]);}

lx(add(INT,'servo',BX(0.012,0.024,0.023),mat.servo15,[0.015,0.058,0]),'MG90S kickstand servo');

lx(add(INT,'buck_5v',BX(0.006,0.017,0.016),mat.servo15,[0.007,0.06,-0.03]),'5 V / 3 A buck');
lx(add(INT,'bq25798',BX(0.003,0.022,0.028),mat.pcb2,[0.0055,0.088,0.026]),'BQ25798 2S charger');

tube(INT,'motor_leads',[[0.006,0.052,0.03],[0.004,0.042,0.03],[0,AY+0.006,0.03]],mat.power,0.0008);
tube(INT,'motor_leads2',[[0.006,0.052,0.03],[0.003,0.042,-0.01],[0,AY+0.006,-0.03]],mat.power,0.0008);
tube(INT,'i2c',[[-0.006,0.083,0.006],[-0.004,0.05,0.004],[0,AY+0.008,0.001]],mat.wire,0.0007);
tube(INT,'i2c_tof',[[-0.006,0.085,0.016],[0.016,0.04,0.02],[FX-0.008,0.027,0.022]],mat.wire,0.0007);
tube(INT,'i2c_tof_r',[[-0.009,0.083,-0.016],[-0.02,0.04,-0.02],[-FX+0.008,0.027,-0.022]],mat.wire,0.0007);
tube(INT,'lidar_lead',[[-0.006,0.1,0.01],[0.016,0.092,0.006],[FX-0.004,0.088,0]],mat.wire,0.0007);
tube(INT,'batt_lead',[[-0.016,0.13,-0.02],[-0.004,0.11,0.0],[0.004,0.095,0.02]],mat.power,0.0012);
tube(INT,'spi',[[0.022,0.165,-0.004],[0.028,0.158,-0.006],[0.032,0.15,-0.004]],mat.wire,0.0007);
tube(INT,'spk_lead',[[0.018,0.118,0.022],[0.026,0.112,0.01],[0.03,0.108,0.004]],mat.wire,0.0007);

stage.setObject(model);

// ---------- views ----------
const VIEWS={
 side:{dir:[0,0.03,1],fov:16,label:'Side',pad:1.2},
 front:{dir:[1,0.03,0],fov:16,label:'Front',pad:1.2},
 top:{dir:[0.002,1,0],fov:16,label:'Top',pad:1.2},
 iso:{dir:[1,0.5,1.1],fov:24,label:'3/4'},
 rear:{dir:[-1,0.25,0.45],fov:16,label:'Rear',pad:1.2},
 exploded:{dir:[0.85,0.35,1],fov:24,labels:'ex',pad:1.05,label:'Exploded'},
 xray:{dir:[0.6,0.55,1],fov:24,labels:'x',pad:1.08,label:'X-ray'},
};
const camera=stage._camera,ctl=stage._controls;
if(embed)ctl.enableZoom=false;
let labels=[];
const ov=document.getElementById('ov'),ln=document.getElementById('ln');
const exGroups=[];model.traverse(o=>{if(o.userData&&o.userData.ex)exGroups.push(o);});
function apply(v){
 view=VIEWS[v]?v:'iso';const cfg=VIEWS[view],ex=view==='exploded',xr=view==='xray';
 for(const g of exGroups){g.position.copy(g.userData.base);if(ex)g.position.add(V(...g.userData.ex));}
 INT.visible=!ex;
 for(const m of [mat.shell,mat.teal,mat.tealDeep]){m.transparent=xr;m.opacity=xr?0.13:1;m.depthWrite=!xr;m.needsUpdate=true;}
 model.updateMatrixWorld(true);
 const box=new THREE.Box3();model.traverseVisible(o=>{if(o.isMesh&&o.name!=='shelf')box.expandByObject(o);});
 const c=box.getCenter(V()),dir=V(...cfg.dir).normalize(),fwd=dir.clone().negate();
 const right=V().crossVectors(fwd,Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0)).normalize(),up=V().crossVectors(right,fwd);
 camera.fov=cfg.fov;camera.up.copy(Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0));
 const tV=Math.tan(camera.fov*Math.PI/360),tH=tV*camera.aspect*(cfg.labels?Math.max(0.42,1-440/innerWidth):1);
 let d=0;for(let i=0;i<8;i++){const p=V(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).sub(c);const w=p.dot(dir);d=Math.max(d,w+Math.abs(p.dot(right))/tH,w+Math.abs(p.dot(up))/tV);}
 d*=(cfg.pad||1.12);
 camera.position.copy(c).addScaledVector(dir,d);camera.near=d/60;camera.far=d*30;camera.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 ov.innerHTML='';ln.innerHTML='';labels=[];
 if(cfg.labels){let n=0;
  model.traverseVisible(o=>{const t=cfg.labels==='ex'?(o.isGroup&&o.userData.ex&&o.userData.label):o.userData.lx;if(!t)return;n++;
   const b=new THREE.Box3().setFromObject(o);const el=document.createElement('div');el.className='lb';el.innerHTML='<b>'+String(n).padStart(2,'0')+'</b>'+t;ov.appendChild(el);labels.push({p:b.getCenter(V()),el});});}
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}
const bar=document.getElementById('bar');
for(const k in VIEWS){const b=document.createElement('button');b.textContent=VIEWS[k].label;b.dataset.v=k;b.onclick=()=>apply(k);bar.appendChild(b);}
function layout(){
 if(labels.length){const W=innerWidth,Hh=innerHeight,cx=W/2;const pts=labels.map(L=>{const q=L.p.clone().project(camera);return {L,x:(q.x+1)/2*W,y:(1-q.y)/2*Hh};});
  let svg='';for(const side of [0,1]){const col=pts.filter(p=>(p.x>=cx)===!!side).sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=25;
   col.forEach(p=>{p.ly=Math.max(p.y,prev+gap);prev=p.ly;});const over=col.length?col[col.length-1].ly-(Hh-16):0;if(over>0)col.forEach(p=>p.ly-=over);
   col.forEach(p=>{const el=p.L.el,w=el.offsetWidth;if(side){el.style.right='12px';el.style.left='';}else{el.style.left='12px';el.style.right='';}el.style.top=p.ly+'px';
    const colX=side?W-12-w:12+w;const ex=side?colX-2:colX+2,el2=side?colX-14:colX+14;svg+=`<polyline points="${ex},${p.ly} ${el2},${p.ly} ${p.x},${p.y}" fill="none" stroke="#23292b" stroke-width="1.2"/><circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#c8463a" stroke="#23292b" stroke-width="1"/>`;});}
  ln.innerHTML=svg;}}
function tick(){layout();requestAnimationFrame(tick);}
window.wobble={apply:v=>{apply(v);stage._renderer.render(stage._scene,camera);layout();}};
apply(view);stage._renderer.render(stage._scene,camera);layout();tick();
new ResizeObserver(()=>setTimeout(()=>apply(view),30)).observe(stage);
</script>
