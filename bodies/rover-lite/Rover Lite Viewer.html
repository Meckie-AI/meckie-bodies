<script type="module">
const stage=document.querySelector('three-d-stage');
const {THREE}=await stage.ready;
const Q=new URLSearchParams(location.search);
const embed=Q.get('embed')==='1';
let view=Q.get('view')||'iso';
const pose=Q.get('pose')||'explore';
if(embed){stage.shadowRoot.querySelectorAll('.toolbar,.note').forEach(e=>e.style.display='none');document.getElementById('bar').style.display='none';}
const M=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??0.55,metalness:o.m??0});if(o.e){m.emissive=new THREE.Color(o.e);m.emissiveIntensity=o.ei??1;}m.name=name;return m;};
const mat={
 shell:M('PLA_cream',0xefe3c8,{r:0.42}),
 teal:M('PLA_seafoam',0x5ea49b,{r:0.42}),
 tealDeep:M('PLA_seafoam_paint',0x3f7d76,{r:0.5}),
 red:M('signal_red',0xc8463a,{r:0.38}),
 chrome:M('chrome_trim',0xdfe2e4,{r:0.2,m:0.35}),
 alu:M('brushed_alu_finish',0xc9cdd0,{r:0.34,m:0.45}),
 brass:M('brass_finish',0xc29a48,{r:0.3,m:0.55}),
 cf:M('PLA_structural',0x323438,{r:0.72}),
 servo15:M('STS3215_black',0x232427,{r:0.5}),
 steel:M('steel',0xbfc3c7,{r:0.22,m:0.4}),
 tpu:M('TPU_foot',0xb83e33,{r:0.85}),
 glass:M('display_glass',0x163638,{r:0.12,e:0x0c2a2a,ei:0.7}),
 glow:M('eye_glow',0xa8f7ea,{e:0x7ff0dc,ei:1.5}),
 batt:M('lipo_wrap',0x37598a,{r:0.6}),
 pcb:M('pcb_green',0x2e6a46,{r:0.6}),
 pcb2:M('pcb_purple',0x6a3f8e,{r:0.6}),
 wire:M('bus_wire',0x2a2a2a,{r:0.7}),
 power:M('power_wire',0xc23a2f,{r:0.6}),
 shelf:M('shelf_context',0xb9b2a2,{r:0.8}),
};
for(const k of ['shell','teal','tealDeep'])mat[k].side=THREE.DoubleSide;
mat.shelf.transparent=true;mat.shelf.opacity=0.45;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(p,name,geo,m,pos=[0,0,0],rot=[0,0,0],sc){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(...pos);o.rotation.set(...rot);if(sc)o.scale.set(...sc);p.add(o);return o;}
function G(p,name,o={}){const g=new THREE.Group();g.name=name;if(o.pos)g.position.set(...o.pos);g.userData={label:o.label,ex:o.ex,base:g.position.clone()};p.add(g);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CZ=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateX(Math.PI/2);
const CX=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateZ(Math.PI/2);
const CY=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s);
const lx=(o,t)=>{o.userData.lx=t;return o;};
const tube=(p,n,pts,m,r=0.0015)=>add(p,n,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(q=>V(...q))),48,r,8),m);
function rr(s,hw,hh,r){s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function halfShell(sign){const w=0.034,h=0.036,r=0.026,s=new THREE.Shape();
 if(sign>0){s.moveTo(0,-h);s.lineTo(w-r,-h);s.absarc(w-r,-h+r,r,-Math.PI/2,0,false);s.lineTo(w,h-r);s.absarc(w-r,h-r,r,0,Math.PI/2,false);s.lineTo(0,h);s.lineTo(0,-h);}
 else{s.moveTo(0,h);s.lineTo(-(w-r),h);s.absarc(-(w-r),h-r,r,Math.PI/2,Math.PI,false);s.lineTo(-w,-h+r);s.absarc(-(w-r),-h+r,r,Math.PI,Math.PI*1.5,false);s.lineTo(0,-h);s.lineTo(0,h);}
 const g=new THREE.ExtrudeGeometry(s,{depth:0.08,bevelEnabled:true,bevelThickness:0.008,bevelSize:0.008,bevelSegments:6,curveSegments:24});g.translate(0,0,-0.04);return g;}
const lathe=pts=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),96);

const model=new THREE.Group();model.name='RoverLite';
mat.tire=M('TPU_track_black',0x262728,{r:0.85});
const INT=G(model,'internals');
const PO={explore:{pan:0,tilt:0},look:{pan:28,tilt:14},sleepy:{pan:0,tilt:-25}}[pose]||{pan:0,tilt:0};
const D=Math.PI/180;
const SP={x:-0.08,y:0.022,r:0.018},ID={x:0.08,y:0.03,r:0.016},RWX=[-0.04,0.0,0.04],TW=0.026,ZT=0.06;
function trackPts(){const pts=[],T=0.0015,Rs=SP.r+T,Ri=ID.r+T,yb=0.0015;
 for(let i=0;i<=20;i++){const t=i/20;pts.push([ID.x+(SP.x-ID.x)*t,ID.y+Ri+(SP.y+Rs-ID.y-Ri)*t]);}
 for(let i=1;i<=16;i++){const q=Math.PI/2+i/16*Math.PI;pts.push([SP.x+Rs*Math.cos(q),SP.y+Rs*Math.sin(q)]);}
 for(let i=1;i<=16;i++){const t=i/16;pts.push([SP.x+(0.045-SP.x)*t,(SP.y-Rs)+(yb-(SP.y-Rs))*t]);}
 const a0=-115*D,ex=ID.x+Ri*Math.cos(a0),ey=ID.y+Ri*Math.sin(a0);
 for(let i=1;i<=6;i++){const t=i/6;pts.push([0.045+(ex-0.045)*t,yb+(ey-yb)*t]);}
 for(let i=1;i<16;i++){const q=a0+i/16*(Math.PI/2-a0);pts.push([ID.x+Ri*Math.cos(q),ID.y+Ri*Math.sin(q)]);}
 return pts;}
function along(pts,step,fn){const n=pts.length,L=[0];for(let i=1;i<=n;i++){const p=pts[i-1],q=pts[i%n];L.push(L[i-1]+Math.hypot(q[0]-p[0],q[1]-p[1]));}
 const tot=L[n],cnt=Math.floor(tot/step);let j=0;
 for(let k=0;k<cnt;k++){const s=k*tot/cnt;while(L[j+1]<s)j++;const p=pts[j],q=pts[(j+1)%n],t=(s-L[j])/(L[j+1]-L[j]||1);fn(p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,Math.atan2(q[1]-p[1],q[0]-p[0]),k);}}
const TP=trackPts();
for(const sd of [-1,1]){const z0=sd*ZT;
 const tr=G(model,sd>0?'track_R':'track_L',{label:sd>0?'TPU track loop · printed as a Ø150 ring':null,ex:[0,0,sd*0.06]});
 along(TP,0.0066,(x,y,ang,k)=>{const nx=Math.sin(ang),ny=-Math.cos(ang);
  add(tr,'pad',BX(0.006,0.0028,TW),mat.tire,[x,y,z0],[0,0,ang]);
  if(k%2===0){add(tr,'grouser',BX(0.0022,0.0024,TW-0.002),mat.tire,[x+nx*0.0024,y+ny*0.0024,z0],[0,0,ang]);
   add(tr,'guide_tooth',BX(0.003,0.0035,0.006),mat.tire,[x-nx*0.003,y-ny*0.003,z0],[0,0,ang]);}});
 const rg=G(model,sd>0?'running_gear_R':'running_gear_L',{label:sd>0?'Sprocket, idler, road wheels · 683ZZ':null,ex:[0,0,sd*0.035]});
 add(rg,'sprocket',CZ(SP.r,TW-0.002,40),mat.cf,[SP.x,SP.y,z0]);
 add(rg,'sprocket_cap',CZ(0.009,0.003,32),mat.chrome,[SP.x,SP.y,z0+sd*0.014]);
 add(rg,'sprocket_ring',new THREE.TorusGeometry(0.0095,0.0014,10,32),mat.red,[SP.x,SP.y,z0+sd*0.0145]);
 add(rg,'idler',CZ(ID.r,TW-0.002,40),mat.shell,[ID.x,ID.y,z0]);
 add(rg,'idler_cap',CZ(0.007,0.003,32),mat.chrome,[ID.x,ID.y,z0+sd*0.014]);
 for(const x of RWX){add(rg,'road_wheel',CZ(0.012,TW-0.002,32),mat.shell,[x,0.0135,z0]);add(rg,'road_cap',CZ(0.0055,0.0025,24),mat.chrome,[x,0.0135,z0+sd*0.0135]);}
 const fr=G(model,sd>0?'track_frame_R':'track_frame_L',{label:sd>0?'Track frame · PLA, idler tension slot':null,ex:[0,-0.02,sd*0.015]});
 add(fr,'inner_plate',BX(0.19,0.026,0.003),mat.cf,[0,0.026,sd*0.0455]);
 add(fr,'tension_block',BX(0.014,0.01,0.004),mat.cf,[ID.x-0.004,ID.y,sd*0.0455]);
 const fd=G(model,sd>0?'fender_R':'fender_L',{label:sd>0?'Fenders · PLA sea foam, chrome edge, red pinstripe':null,ex:[0,0.04,sd*0.03]});
 {const s=rr(new THREE.Shape(),0.103,0.0035,0.0035);const g=new THREE.ExtrudeGeometry(s,{depth:0.034,bevelEnabled:true,bevelThickness:0.002,bevelSize:0.002,bevelSegments:3,curveSegments:12});g.translate(0,0,-0.017);add(fd,'fender',g,mat.teal,[0,0.057,z0]);}
 add(fd,'fender_chrome',BX(0.206,0.0018,0.0018),mat.chrome,[0,0.057,z0+sd*0.0195]);
 add(fd,'pinstripe',BX(0.15,0.0016,0.0008),mat.red,[0,0.0535,z0+sd*0.0193]);}
// hull
const hull=G(model,'hull',{label:'Hull tub · PLA sea foam',ex:[0,-0.05,0]});
{const s=rr(new THREE.Shape(),0.092,0.016,0.012);const g=new THREE.ExtrudeGeometry(s,{depth:0.07,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.004,bevelSegments:4,curveSegments:16});g.translate(0,0,-0.035);add(hull,'hull',g,mat.teal,[0,0.036,0]);}
add(hull,'l8cx_bezel',BX(0.003,0.012,0.024),mat.chrome,[0.0965,0.042,0]);
add(hull,'l8cx_window',BX(0.002,0.008,0.018),mat.glass,[0.0978,0.042,0]);
for(const [x,n,r] of [[0.096,'drop_front',-0.5],[-0.096,'drop_rear',0.5]]){add(hull,n+'_bezel',BX(0.003,0.008,0.016),mat.red,[x,0.025,0],[0,0,r]);add(hull,n+'_window',BX(0.002,0.004,0.01),mat.glass,[x+Math.sign(x)*0.0012,0.025,0],[0,0,r]);}
add(hull,'usbc_bezel',BX(0.003,0.007,0.014),mat.chrome,[-0.0965,0.042,0.016]);
add(hull,'usbc_port',BX(0.002,0.0034,0.009),mat.servo15,[-0.0978,0.042,0.016]);
add(hull,'switch_base',CX(0.0045,0.004,20),mat.chrome,[-0.0965,0.043,-0.016]);
add(hull,'switch_lever',new THREE.CylinderGeometry(0.0013,0.0018,0.013,10),mat.brass,[-0.101,0.047,-0.016],[0,0,0.9]);
const trays=G(model,'trays',{label:'Electronics trays · PLA, insert grid',ex:[0,0.04,0]});
add(trays,'tray_rear',BX(0.068,0.0055,0.068),mat.cf,[-0.035,0.043,0]);add(trays,'tray_front',BX(0.034,0.0055,0.068),mat.cf,[0.069,0.043,0]);
const deck=G(model,'deck',{label:'Deck lid · PLA cream, chrome band',ex:[0,0.05,0]});
{const s=rr(new THREE.Shape(),0.088,0.006,0.006);const g=new THREE.ExtrudeGeometry(s,{depth:0.068,bevelEnabled:true,bevelThickness:0.003,bevelSize:0.003,bevelSegments:3,curveSegments:12});g.translate(0,0,-0.034);add(deck,'deck',g,mat.shell,[0,0.062,0]);}
for(const s of [-1,1])add(deck,'deck_band',BX(0.18,0.002,0.002),mat.chrome,[0,0.0545,s*0.0395]);
for(let i=0;i<4;i++)add(deck,'grille_bar',BX(0.0022,0.0015,0.024),mat.chrome,[-0.074+i*0.006,0.0712,0]);
const tt=G(model,'turntable',{label:'Turntable · chrome, 6806 bearing',ex:[0,0.07,0]});
add(tt,'turntable',CY(0.024,0.004,48),mat.chrome,[0.015,0.073,0]);
add(tt,'brg_6806',new THREE.TorusGeometry(0.0185,0.003,10,48).rotateX(Math.PI/2),mat.steel,[0.015,0.069,0]);
// pan stage
const PIV=0.061;
const pan=G(model,'pan_stage',{pos:[0.015,0.075,0],ex:[0,0.1,0]});pan.rotation.y=PO.pan*D;
const yoke=G(pan,'yoke',{label:'Yoke · PLA, brushed-alu finish'});
add(yoke,'neck',CY(0.011,0.01,32),mat.alu,[0,0.005,0]);
add(yoke,'yoke_base',BX(0.026,0.006,0.1),mat.alu,[0,0.013,0]);
for(const s of [-1,1]){add(yoke,'yoke_arm',BX(0.016,PIV-0.013,0.006),mat.alu,[0,(PIV+0.013)/2,s*0.047]);add(yoke,'yoke_boss',CZ(0.009,0.006,32),mat.alu,[0,PIV,s*0.047]);add(yoke,'pivot_cap',CZ(0.0068,0.003,32),mat.brass,[0,PIV,s*0.0515]);}
const hr=G(pan,'harness',{label:'Neck harness · red braid, CSI FFC + 12c ribbon',ex:[-0.04,0,0]});
const hp=[[-0.016,0.0,0.0],[-0.034,0.012,0.022],[-0.05,0.036,0.03],[-0.046,0.056,0.016],[-0.036,PIV-0.012,0.006]];
tube(hr,'harness',hp,mat.power,0.0028);tube(hr,'trace',hp.map(p=>[p[0]-0.0006,p[1],p[2]+0.0026]),mat.shell,0.0008);
for(const c of [hp[1],hp[3]])add(hr,'p_clip',new THREE.TorusGeometry(0.004,0.0011,8,24).rotateX(Math.PI/2),mat.brass,c);
// head (drum, tilt about its own axis)
const head=G(pan,'head',{pos:[0,PIV,0],ex:[0,0.08,0]});head.rotation.z=PO.tilt*D;
const drum=G(head,'drum',{label:'Helmet drum · PLA cream tube + two screwed end caps',ex:[0,0.03,0]});
add(drum,'drum',CZ(0.042,0.08,72),mat.shell);
for(const s of [-1,1]){add(drum,'end_disc',CZ(0.039,0.002,64),mat.teal,[0,0,s*0.0405]);add(drum,'end_ring',new THREE.TorusGeometry(0.0405,0.0022,12,72),mat.chrome,[0,0,s*0.04]);
 add(drum,'mic_port',new THREE.TorusGeometry(0.0024,0.0008,8,24),mat.chrome,[0.02,0.01,s*0.0418]);}
add(drum,'equator',new THREE.TorusGeometry(0.0425,0.0013,10,72).rotateY(Math.PI/2),mat.chrome);
{const s=new THREE.Shape();s.moveTo(-0.004,0.0405);s.quadraticCurveTo(-0.02,0.056,-0.036,0.054);s.quadraticCurveTo(-0.03,0.04,-0.026,0.033);s.lineTo(-0.004,0.0405);
 const g=new THREE.ExtrudeGeometry(s,{depth:0.003,bevelEnabled:true,bevelThickness:0.0008,bevelSize:0.0008,bevelSegments:2,curveSegments:16});g.translate(0,0,-0.0015);add(drum,'fin',g,mat.red);}
add(drum,'grommet',new THREE.TorusGeometry(0.0035,0.0013,8,24).rotateY(Math.PI/2),mat.servo15,[-0.042,-0.012,0.006]);
const face=G(head,'face',{label:'Ø32 display · snap ring inside, riveted porthole bezel clicks on',ex:[0.05,0,0]});
const FY=-0.004,FX=Math.sqrt(0.042*0.042-FY*FY);
add(face,'face_disc',CX(0.0215,0.004,64),mat.teal,[FX-0.002,FY,0]);
add(face,'porthole',new THREE.TorusGeometry(0.0205,0.0032,16,64).rotateY(Math.PI/2),mat.chrome,[FX+0.0005,FY,0]);
add(face,'glass',CX(0.0178,0.002,64),mat.glass,[FX-0.0005,FY,0]);
for(let i=0;i<8;i++){const q=i/8*Math.PI*2,yy=FY+0.0255*Math.sin(q),zz=0.0255*Math.cos(q);add(face,'rivet',new THREE.SphereGeometry(0.0017,12,8),mat.brass,[Math.sqrt(Math.max(0,0.042*0.042-yy*yy))+0.0004,yy,zz]);}
const sl=pose==='sleepy';
for(const z of [-0.0072,0.0072]){add(face,'eye',new THREE.SphereGeometry(0.0055,24,16),mat.glow,[FX+0.0005,FY+0.001,z],[0,0,0],sl?[0.35,0.22,1]:[0.35,1,1]);if(!sl)add(face,'pupil',new THREE.SphereGeometry(0.0026,16,12),mat.servo15,[FX+0.0025,FY+0.001,z+(PO.pan?0.0012:0)],[0,0,0],[0.35,1,1]);}
lx(add(face,'display_pcb',CX(0.0185,0.003,40),mat.pcb,[FX-0.006,FY,0]),'Ø32 round display · GC9A01');
const cam=G(head,'camera',{label:'Camera lamp · chrome, Camera Module 3',ex:[0.03,0.06,0]});
add(cam,'lamp_housing',CX(0.0085,0.012,32),mat.chrome,[0.03,0.032,0],[0,0,0.75]);
add(cam,'lamp_ring',new THREE.TorusGeometry(0.0085,0.0013,10,32).rotateY(Math.PI/2),mat.red,[0.0345,0.0362,0],[0,0,0.75]);
add(cam,'lens',CX(0.0032,0.002,24),mat.glass,[0.0352,0.037,0],[0,0,0.75]);
lx(add(cam,'cam_pcb',BX(0.003,0.024,0.025),mat.pcb,[0.024,0.024,0],[0,0,0.75]),'Camera Module 3 · lamp housing');
const tilt=G(head,'tilt_servo',{label:'STS3215 · tilt · ID 2, inside drum'});
lx(add(tilt,'tilt_case',BX(0.025,0.045,0.035),mat.servo15,[-0.002,-0.0116,-0.019]),'STS3215 · tilt · ID 2, sleeve on the left end cap');
add(tilt,'tilt_horn',CZ(0.0105,0.003),mat.chrome,[0,0,-0.0435]);
const HIN=G(head,'head_internals');
for(const s of [-1,1]){const o=add(HIN,'mic_pcb',BX(0.009,0.009,0.002),mat.pcb,[0.02,0.01,s*0.039]);if(s>0)lx(o,'Mic ×2 · ICS-43434, 84 mm apart');}
tube(HIN,'h_in',[[-0.038,-0.012,0.006],[-0.02,-0.02,0.02],[0.01,-0.012,0.016],[0.026,FY,0.01]],mat.power,0.0012);

// ---------- views ----------
const VIEWS={
 side:{dir:[0,0.03,1],fov:16,label:'Side',pad:1.2},
 front:{dir:[1,0.03,0],fov:16,label:'Front',pad:1.2},
 top:{dir:[0.002,1,0],fov:16,label:'Top',pad:1.2},
 iso:{dir:[1,0.5,1.1],fov:24,label:'3/4'},
 rear:{dir:[-1,0.25,0.45],fov:16,label:'Rear',pad:1.2},
 exploded:{dir:[0.85,0.35,1],fov:24,labels:'ex',pad:1.05,label:'Exploded'},
 xray:{dir:[0.6,0.55,1],fov:24,labels:'x',pad:1.08,label:'X-ray'},
};
const camera=stage._camera,ctl=stage._controls;
if(embed)ctl.enableZoom=false;
let labels=[];
const ov=document.getElementById('ov'),ln=document.getElementById('ln');
const exGroups=[];model.traverse(o=>{if(o.userData&&o.userData.ex)exGroups.push(o);});
function apply(v){
 view=VIEWS[v]?v:'iso';const cfg=VIEWS[view],ex=view==='exploded',xr=view==='xray';
 for(const g of exGroups){g.position.copy(g.userData.base);if(ex)g.position.add(V(...g.userData.ex));}
 INT.visible=!ex;HIN.visible=!ex;
 for(const m of [mat.shell,mat.teal,mat.tealDeep,mat.tire]){m.transparent=xr;m.opacity=xr?0.13:1;m.depthWrite=!xr;m.needsUpdate=true;}
 model.updateMatrixWorld(true);
 const box=new THREE.Box3();model.traverseVisible(o=>{if(o.isMesh&&o.name!=='shelf')box.expandByObject(o);});
 const c=box.getCenter(V()),dir=V(...cfg.dir).normalize(),fwd=dir.clone().negate();
 const right=V().crossVectors(fwd,Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0)).normalize(),up=V().crossVectors(right,fwd);
 camera.fov=cfg.fov;camera.up.copy(Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0));
 const tV=Math.tan(camera.fov*Math.PI/360),tH=tV*camera.aspect*(cfg.labels?Math.max(0.42,1-440/innerWidth):1);
 let d=0;for(let i=0;i<8;i++){const p=V(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).sub(c);const w=p.dot(dir);d=Math.max(d,w+Math.abs(p.dot(right))/tH,w+Math.abs(p.dot(up))/tV);}
 d*=(cfg.pad||1.12);
 camera.position.copy(c).addScaledVector(dir,d);camera.near=d/60;camera.far=d*30;camera.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 ov.innerHTML='';ln.innerHTML='';labels=[];
 if(cfg.labels){let n=0;
  model.traverseVisible(o=>{const t=cfg.labels==='ex'?(o.isGroup&&o.userData.ex&&o.userData.label):o.userData.lx;if(!t)return;n++;
   const b=new THREE.Box3().setFromObject(o);const el=document.createElement('div');el.className='lb';el.innerHTML='<b>'+String(n).padStart(2,'0')+'</b>'+t;ov.appendChild(el);labels.push({p:b.getCenter(V()),el});});}
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}
const bar=document.getElementById('bar');
for(const k in VIEWS){const b=document.createElement('button');b.textContent=VIEWS[k].label;b.dataset.v=k;b.onclick=()=>apply(k);bar.appendChild(b);}
function layout(){
 if(labels.length){const W=innerWidth,Hh=innerHeight,cx=W/2;const pts=labels.map(L=>{const q=L.p.clone().project(camera);return {L,x:(q.x+1)/2*W,y:(1-q.y)/2*Hh};});
  let svg='';for(const side of [0,1]){const col=pts.filter(p=>(p.x>=cx)===!!side).sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=25;
   col.forEach(p=>{p.ly=Math.max(p.y,prev+gap);prev=p.ly;});const over=col.length?col[col.length-1].ly-(Hh-16):0;if(over>0)col.forEach(p=>p.ly-=over);
   col.forEach(p=>{const el=p.L.el,w=el.offsetWidth;if(side){el.style.right='12px';el.style.left='';}else{el.style.left='12px';el.style.right='';}el.style.top=p.ly+'px';
    const colX=side?W-12-w:12+w;const ex=side?colX-2:colX+2,el2=side?colX-14:colX+14;svg+=`<polyline points="${ex},${p.ly} ${el2},${p.ly} ${p.x},${p.y}" fill="none" stroke="#23292b" stroke-width="1.2"/><circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#c8463a" stroke="#23292b" stroke-width="1"/>`;});}
  ln.innerHTML=svg;}}
function tick(){layout();requestAnimationFrame(tick);}
window.roverLite={apply:v=>{apply(v);stage._renderer.render(stage._scene,camera);layout();}};
apply(view);stage._renderer.render(stage._scene,camera);layout();tick();
new ResizeObserver(()=>setTimeout(()=>apply(view),30)).observe(stage);
