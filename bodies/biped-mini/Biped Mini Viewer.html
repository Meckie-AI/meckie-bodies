<script type="module">
const stage=document.querySelector('three-d-stage');
const {THREE}=await stage.ready;
const Q=new URLSearchParams(location.search);
const embed=Q.get('embed')==='1';

const pose=Q.get('pose')||'stand';
if(embed){stage.shadowRoot.querySelectorAll('.toolbar,.note').forEach(e=>e.style.display='none');document.getElementById('bar').style.display='none';}
const M=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??0.55,metalness:o.m??0});if(o.e){m.emissive=new THREE.Color(o.e);m.emissiveIntensity=o.ei??1;}m.name=name;return m;};
const mat={
 shell:M('PLA_cream',0xefe3c8,{r:0.42}),
 teal:M('PLA_seafoam',0x5ea49b,{r:0.42}),
 tealDeep:M('PLA_seafoam_paint',0x3f7d76,{r:0.5}),
 red:M('signal_red',0xc8463a,{r:0.38}),
 chrome:M('chrome_trim',0xdfe2e4,{r:0.2,m:0.35}),
 alu:M('brushed_alu_finish',0xc9cdd0,{r:0.34,m:0.45}),
 brass:M('brass_finish',0xc29a48,{r:0.3,m:0.55}),
 cf:M('PLA_structural',0x323438,{r:0.72}),
 servo15:M('STS3215_black',0x232427,{r:0.5}),
 steel:M('steel',0xbfc3c7,{r:0.22,m:0.4}),
 tpu:M('TPU_foot',0xb83e33,{r:0.85}),
 glass:M('display_glass',0x163638,{r:0.12,e:0x0c2a2a,ei:0.7}),

 batt:M('lipo_wrap',0x37598a,{r:0.6}),
 pcb:M('pcb_green',0x2e6a46,{r:0.6}),
 pcb2:M('pcb_purple',0x6a3f8e,{r:0.6}),
 wire:M('bus_wire',0x2a2a2a,{r:0.7}),
 power:M('power_wire',0xc23a2f,{r:0.6}),
 shelf:M('shelf_context',0xb9b2a2,{r:0.8}),
};
for(const k of ['shell','teal','tealDeep'])mat[k].side=THREE.DoubleSide;
mat.shelf.transparent=true;mat.shelf.opacity=0.45;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(p,name,geo,m,pos=[0,0,0],rot=[0,0,0],sc){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(...pos);o.rotation.set(...rot);if(sc)o.scale.set(...sc);p.add(o);return o;}
function G(p,name,o={}){const g=new THREE.Group();g.name=name;if(o.pos)g.position.set(...o.pos);g.userData={label:o.label,ex:o.ex,base:g.position.clone()};p.add(g);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CZ=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateX(Math.PI/2);
const CX=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateZ(Math.PI/2);
const CY=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s);
const lx=(o,t)=>{o.userData.lx=t;return o;};
const tube=(p,n,pts,m,r=0.0015)=>add(p,n,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(q=>V(...q))),48,r,8),m);
function rr(s,hw,hh,r){s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function halfShell(sign){const w=0.034,h=0.036,r=0.026,s=new THREE.Shape();
 if(sign>0){s.moveTo(0,-h);s.lineTo(w-r,-h);s.absarc(w-r,-h+r,r,-Math.PI/2,0,false);s.lineTo(w,h-r);s.absarc(w-r,h-r,r,0,Math.PI/2,false);s.lineTo(0,h);s.lineTo(0,-h);}
 else{s.moveTo(0,h);s.lineTo(-(w-r),h);s.absarc(-(w-r),h-r,r,Math.PI/2,Math.PI,false);s.lineTo(-w,-h+r);s.absarc(-(w-r),-h+r,r,Math.PI,Math.PI*1.5,false);s.lineTo(0,-h);s.lineTo(0,h);}
 const g=new THREE.ExtrudeGeometry(s,{depth:0.08,bevelEnabled:true,bevelThickness:0.008,bevelSize:0.008,bevelSegments:6,curveSegments:24});g.translate(0,0,-0.04);return g;}
const lathe=pts=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),96);

const model=new THREE.Group();model.name='BipedMini';
mat.bump=M('TPU_red',0xc8463a,{r:0.8});
mat.ww=M('cream_trim',0xf2ead6,{r:0.5});
const D=Math.PI/180;
const arms=Q.get('arms')==='1', cfg=Q.get('cfg')==='spec'?'spec':'ar';
const L1=0.058,L2=0.056,AK=0.044,HZ=0.038;
const POS={stand:{st:[15,15],sw:[15,15],psi:0,th:0},step:{st:[15,15],sw:[35,35],psi:0,th:14},sit:{st:[15,85],sw:[15,85],psi:19,th:0},wave:{st:[15,15],sw:[15,15],psi:0,th:0}};
const P0=POS[pose]||POS.stand;
const sag=([s,t])=>{const kx=L2*Math.sin(s*D),ky=AK+L2*Math.cos(s*D);return {hx:kx-L1*Math.sin(t*D),hy:ky+L1*Math.cos(t*D)};};
const SG=sag(P0.st),th=P0.th*D,psi=P0.psi*D,lh=SG.hy-AK;
const bodyG=G(model,'body',{pos:[SG.hx,AK+lh*Math.cos(th)+(cfg==='spec'&&th?0.006:0),lh*Math.sin(th)]});
bodyG.rotation.set(0,0,psi);
const INT=G(bodyG,'internals');
const TC=0.072,TA=0.05,TB=0.052,TZ=1.16;
const TR=y=>TA*Math.sqrt(Math.max(0,1-((y-TC)/TB)**2));
const prof=(y0,y1,n=24)=>{const p=[];for(let i=0;i<=n;i++){const y=y0+(y1-y0)*i/n;p.push([TR(y),y]);}if(p[0][0]<0.001)p[0][0]=0;return p;};
function ellRing(p,n,y,off,r,m){const a2=TR(y)+off,pts=[];for(let i=0;i<72;i++){const q=i/72*Math.PI*2;pts.push(V(a2*Math.cos(q),y,a2*TZ*Math.sin(q)));}return add(p,n,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),144,r,12,true),m);}
function rbox(w,h,d,r){const bv=Math.min(r,d/2-0.0006);const g=new THREE.ExtrudeGeometry(rr(new THREE.Shape(),w/2-bv,h/2-bv,Math.max(0.0012,r-bv)),{depth:d-2*bv,bevelEnabled:true,bevelThickness:bv,bevelSize:bv,bevelSegments:4,curveSegments:12});g.translate(0,0,-(d-2*bv)/2);return g;}
const SF=(y,sd=0,off=0)=>{const r=TR(y)+off;return sd?[0,y,sd*r*TZ]:[r,y,0];};
// torso
const lowT=G(bodyG,'torso_lower',{label:'Lower torso · PLA sea foam, pack bay',ex:[0,-0.03,0]});
{const m=add(lowT,'lower',new THREE.LatheGeometry(prof(TC-TB+0.0005,0.045).map(p=>new THREE.Vector2(p[0],p[1])),72),mat.teal);m.scale.z=TZ;}
add(lowT,'usbc_bezel',BX(0.003,0.007,0.013),mat.chrome,[-TR(0.06)-0.0003,0.06,0.016]);
add(lowT,'usbc_port',BX(0.002,0.0032,0.009),mat.servo15,[-TR(0.06)-0.0016,0.06,0.016]);
add(lowT,'switch_base',CX(0.0042,0.004,20),mat.chrome,[-TR(0.06)-0.0006,0.06,-0.016]);
add(lowT,'switch_lever',new THREE.CylinderGeometry(0.0012,0.0017,0.012,10),mat.brass,[-TR(0.06)-0.005,0.065,-0.016],[0,0,0.9]);
add(lowT,'lidar_bezel',BX(0.003,0.007,0.022),mat.chrome,[TR(0.034)+0.0003,0.034,0],[0,0,-0.6]);
add(lowT,'lidar_window',BX(0.002,0.004,0.016),mat.glass,[TR(0.034)+0.0015,0.0345,0],[0,0,-0.6]);
add(lowT,'drop_front_bezel',BX(0.003,0.006,0.012),mat.red,[TR(0.026)+0.0003,0.026,0],[0,0,-1.0]);
add(lowT,'drop_front_window',BX(0.002,0.0035,0.008),mat.glass,[TR(0.026)+0.0015,0.0265,0],[0,0,-1.0]);
const upT=G(bodyG,'torso_upper',{label:'Upper torso · PLA cream',ex:[0,0.05,0]});
{const m=add(upT,'upper',new THREE.LatheGeometry(prof(0.045,TC+TB-0.0005).map(p=>new THREE.Vector2(p[0],p[1])).concat([new THREE.Vector2(0,TC+TB)]),72),mat.shell);m.scale.z=TZ;}
ellRing(upT,'chrome_band',0.108,0.0004,0.0013,mat.chrome);
for(let i=0;i<4;i++)add(upT,'grille_bar',BX(0.002,0.0015,0.024),mat.chrome,[-TR(0.078+i*0.005)-0.0004,0.078+i*0.005,0]);
const belt=G(bodyG,'belt',{label:'Belt bumper · TPU 95A',ex:[0,0.015,0]});
ellRing(belt,'belt',0.045,0.0012,0.0035,mat.bump);
const FY=0.082,FXc=TR(FY),sl=pose==='sit';
const face=G(bodyG,'face',{label:'Ø32 display · chest porthole, chrome bezel',ex:[0.07,0,0]});
add(face,'visor',CX(0.0215,0.006,64),mat.teal,[FXc-0.002,FY,0]);
add(face,'bezel',new THREE.TorusGeometry(0.0195,0.0024,14,64).rotateY(Math.PI/2),mat.chrome,[FXc+0.0012,FY,0]);
add(face,'glass',CX(0.0168,0.002,64),mat.glass,[FXc+0.0008,FY,0]);
for(let i=0;i<8;i++){const q=i/8*Math.PI*2;add(face,'rivet',new THREE.SphereGeometry(0.0013,10,8),mat.brass,[FXc+0.0014,FY+0.0222*Math.sin(q),0.0222*Math.cos(q)]);}
for(const z of [-0.0068,0.0068]){add(face,'eye',new THREE.SphereGeometry(0.0054,24,16),mat.glow,[FXc+0.0018,FY+0.001,z],[0,0,0],sl?[0.35,0.22,1]:[0.35,1.1,1]);if(!sl){add(face,'pupil',new THREE.SphereGeometry(0.0026,16,12),mat.servo15,[FXc+0.0037,FY,z],[0,0,0],[0.35,1,1]);add(face,'glint',new THREE.SphereGeometry(0.0009,8,6),mat.ww,[FXc+0.0044,FY+0.0013,z+0.001]);}}
lx(add(face,'display_pcb',CX(0.0185,0.003,40),mat.pcb,[FXc-0.008,FY,0]),'Ø32 round display · GC9A01');
// head
const head=G(bodyG,'head',{label:'Head · Camera Module 3, mics, PLA cream',pos:[0,TC+TB-0.002,0],ex:[0,0.07,0]});
add(head,'neck',CY(0.012,0.008,32),mat.chrome,[0,0.003,0]);
add(head,'brim',new THREE.CylinderGeometry(1,1,0.006,48),mat.teal,[0,0.009,0],[0,0,0],[0.023,1,0.031]);
add(head,'dome',new THREE.SphereGeometry(1,48,24,0,Math.PI*2,0,Math.PI/2),mat.shell,[0,0.012,0],[0,0,0],[0.022,0.019,0.03]);
add(head,'visor_band',new THREE.CylinderGeometry(1,1,0.007,48,1,true,Math.PI/2-0.9,1.8),mat.red,[0,0.0165,0],[0,0,0],[0.0222,1,0.0302]);
add(head,'cam_ring',new THREE.TorusGeometry(0.0045,0.0012,10,28).rotateY(Math.PI/2),mat.chrome,[0.0222,0.0165,0]);
add(head,'cam_lens',CX(0.0032,0.002,24),mat.glass,[0.0222,0.0165,0]);
for(const sd of [-1,1])add(head,'mic_port',new THREE.TorusGeometry(0.0022,0.0008,8,24),mat.chrome,[0,0.016,sd*0.029]);
add(head,'antenna',CY(0.0011,0.016,10),mat.chrome,[-0.004,0.038,0]);add(head,'antenna_ball',new THREE.SphereGeometry(0.0045,18,12),mat.red,[-0.004,0.047,0]);
lx(add(head,'cam_pcb',BX(0.003,0.024,0.025),mat.pcb,[0.016,0.016,0]),'Camera Module 3 · head');
// tail sled
const skid=G(bodyG,'skid',{label:'Rear sled · PLA struts, TPU pad, rear drop ToF',ex:[-0.05,-0.02,0]});
for(const z of [-0.03,0.03]){const A=V(-0.038,0.028,z),Bp=V(-0.063,-0.036,z),d=Bp.clone().sub(A);const o=add(skid,'strut',BX(0.008,d.length(),0.006),mat.tealDeep);o.position.copy(A).addScaledVector(d,0.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());}
add(skid,'sled_plate',rbox(0.026,0.005,0.078,0.0024),mat.tealDeep,[-0.065,-0.0375,0]);
add(skid,'sled_trim',BX(0.002,0.0018,0.074),mat.chrome,[-0.0515,-0.0365,0]);
add(skid,'pad',rbox(0.026,0.004,0.078,0.0018),mat.bump,[-0.065,-0.042,0]);
add(skid,'drop_rear_bezel',BX(0.003,0.006,0.012),mat.red,[-0.0785,-0.037,0],[0,0,0.7]);
add(skid,'drop_rear_window',BX(0.002,0.0035,0.008),mat.glass,[-0.0795,-0.0375,0],[0,0,0.7]);
lx(add(skid,'drop_r_pcb',BX(0.002,0.008,0.011),mat.pcb,[-0.0765,-0.036,0],[0,0,0.7]),'Drop-off ToF · rear (sled)');
// arms
for(const sd of [-1,1]){const arm=G(bodyG,sd>0?'arm_R':'arm_L',{label:sd>0?(arms?'Arms · STS3215 shoulders (upgrade), TPU mitts':'Stub arms · printed, TPU mitts'):null,pos:[0,0.09,sd*TR(0.09)*TZ*0.96],ex:[0,0,sd*0.04]});
 const up2=(pose==='wave'&&sd<0);arm.rotation.x=up2?-2.5:sd*0.32;arm.rotation.z=up2?0.15:0;
 if(arms)add(arm,'shoulder_pod',rbox(0.03,0.024,0.014,0.006),mat.alu,[0,0,sd*0.004]);
 add(arm,'shoulder_cap',CZ(0.009,0.004,28),mat.chrome,[0,0,sd*(arms?0.012:0.003)]);
 add(arm,'arm',new THREE.CapsuleGeometry(0.0085,0.026,6,16).translate(0,-0.022,0),mat.teal,[0,0,sd*(arms?0.014:0.006)]);
 add(arm,'mitt',new THREE.SphereGeometry(0.011,20,14),mat.bump,[0,-0.044,sd*(arms?0.014:0.006)],[0,0,0],[1,0.9,0.9]);}
// pelvis + hips
const pel=G(bodyG,'pelvis',{label:'Pelvis frame · PLA'});
add(pel,'pelvis_plate',BX(0.028,0.004,0.036),mat.cf,[0,0.025,0]);
const legs={};
for(const sd of [1,-1]){const side=sd>0?'R':'L',stance=sd>0,ang=stance?P0.st:P0.sw,s=ang[0]*D,t=ang[1]*D;
 const pod=G(bodyG,'hip_pod_'+side,{label:sd>0?'Hip pods · roll + pitch servos, PLA sea foam':null,ex:[0,0,sd*0.04]});
 add(pod,'pod',rbox(0.042,0.03,0.036,0.009),mat.teal,[0,0.011,sd*HZ]);
 add(pod,'roll_horn',CX(0.0105,0.003,28),mat.chrome,[0.0225,0.014,sd*HZ]);
 if(cfg==='spec')add(pod,'yaw_horn',CY(0.0105,0.003,28),mat.chrome,[0,0.0275,sd*HZ]);
 lx(add(INT,'hip_roll_'+side,BX(0.04,0.018,0.024),mat.servo15,[0,0.016,sd*HZ]),sd>0?'STS3215 · hip roll ×2':'');
 lx(add(INT,'hip_pitch_'+side,BX(0.024,0.02,0.032),mat.servo15,[0,0.0,sd*HZ]),sd>0?'STS3215 · hip pitch ×2':'');
 if(cfg==='spec')lx(add(INT,'hip_yaw_'+side,BX(0.04,0.03,0.0247),mat.servo15,[0,0.044,sd*0.03]),sd>0?'STS3215 · hip yaw ×2 (as specified)':'');
 const hip=G(bodyG,'leg_'+side,{label:sd>0?'Legs · STS3215 knee + ankle, cream and sea-foam covers':null,pos:[0,0,sd*HZ],ex:[0,-0.01,sd*0.07]});
 hip.rotation.x=th;
 const thigh=new THREE.Group();thigh.name='thigh_'+side;hip.add(thigh);thigh.rotation.z=t-psi;
 add(thigh,'hip_horn',CZ(0.0105,0.003,28),mat.chrome,[0,0,sd*0.0215]);add(thigh,'hip_cap',CZ(0.0068,0.003,24),mat.brass,[0,0,-sd*0.0215]);
 add(thigh,'thigh_cover',rbox(0.032,0.058,0.038,0.009),mat.shell,[0,-0.026,0]);
 lx(add(thigh,'knee_servo',BX(0.0247,0.045,0.03),mat.servo15,[0,-0.028,0]),sd>0?'STS3215 · knee ×2':'');
 tube(thigh,'harness_t',[[-0.017,-0.002,sd*0.008],[-0.021,-0.025,sd*0.008],[-0.017,-0.048,sd*0.008]],mat.power,0.0022);
 add(thigh,'p_clip',new THREE.TorusGeometry(0.0032,0.0009,8,20).rotateX(Math.PI/2),mat.brass,[-0.0205,-0.025,sd*0.008]);
 const shank=new THREE.Group();shank.name='shank_'+side;thigh.add(shank);shank.position.y=-L1;shank.rotation.z=-(s+t);
 add(shank,'knee_horn',CZ(0.0105,0.003,28),mat.chrome,[0,0,sd*0.0205]);add(shank,'knee_cap',CZ(0.0068,0.003,24),mat.brass,[0,0,-sd*0.0205]);
 add(shank,'shank_cover',rbox(0.03,0.056,0.036,0.009),mat.teal,[0,-0.026,0]);
 lx(add(shank,'ankle_servo',BX(0.0247,0.045,0.03),mat.servo15,[0,-0.024,0]),sd>0?'STS3215 · ankle pitch ×2':'');
 tube(shank,'harness_s',[[-0.016,-0.002,sd*0.008],[-0.02,-0.025,sd*0.008],[-0.016,-0.046,sd*0.008]],mat.power,0.0022);
 const foot=new THREE.Group();foot.name='foot_'+side;shank.add(foot);foot.position.y=-L2;foot.rotation.z=s;
 add(foot,'ankle_horn',CZ(0.0105,0.003,28),mat.chrome,[0,0,sd*0.0195]);add(foot,'ankle_cap',CZ(0.0068,0.003,24),mat.brass,[0,0,-sd*0.0195]);

const VIEWS={

};
const camera=stage._camera,ctl=stage._controls;

const exGroups=[];model.traverse(o=>{if(o.userData&&o.userData.ex)exGroups.push(o);});
function apply(v){
 view=VIEWS[v]?v:'iso';const cfg=VIEWS[view],ex=view==='exploded',xr=view==='xray';
 for(const g of exGroups){g.position.copy(g.userData.base);if(ex)g.position.add(V(...g.userData.ex));}
 INT.visible=!ex;
 for(const m of [mat.shell,mat.teal,mat.tealDeep]){m.transparent=xr;m.opacity=xr?0.13:1;m.depthWrite=!xr;m.needsUpdate=true;}
 model.updateMatrixWorld(true);
 const box=new THREE.Box3();model.traverseVisible(o=>{if(o.isMesh&&o.name!=='shelf')box.expandByObject(o);});
 const c=box.getCenter(V()),dir=V(...cfg.dir).normalize(),fwd=dir.clone().negate();
 const right=V().crossVectors(fwd,Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0)).normalize(),up=V().crossVectors(right,fwd);
 camera.fov=cfg.fov;camera.up.copy(Math.abs(dir.y)>0.95?V(-1,0,0):V(0,1,0));
 const tV=Math.tan(camera.fov*Math.PI/360),tH=tV*camera.aspect*(cfg.labels?Math.max(0.42,1-440/innerWidth):1);
 let d=0;for(let i=0;i<8;i++){const p=V(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).sub(c);const w=p.dot(dir);d=Math.max(d,w+Math.abs(p.dot(right))/tH,w+Math.abs(p.dot(up))/tV);}
 d*=(cfg.pad||1.12);
 camera.position.copy(c).addScaledVector(dir,d);camera.near=d/60;camera.far=d*30;camera.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 ov.innerHTML='';ln.innerHTML='';labels=[];
 if(cfg.labels){let n=0;
  model.traverseVisible(o=>{const t=cfg.labels==='ex'?(o.isGroup&&o.userData.ex&&o.userData.label):o.userData.lx;if(!t)return;n++;
   const b=new THREE.Box3().setFromObject(o);const el=document.createElement('div');el.className='lb';el.innerHTML='<b>'+String(n).padStart(2,'0')+'</b>'+t;ov.appendChild(el);labels.push({p:b.getCenter(V()),el});});}
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}

for(const k in VIEWS){const b=document.createElement('button');b.textContent=VIEWS[k].label;b.dataset.v=k;b.onclick=()=>apply(k);bar.appendChild(b);}
function layout(){
 if(labels.length){const W=innerWidth,Hh=innerHeight,cx=W/2;const pts=labels.map(L=>{const q=L.p.clone().project(camera);return {L,x:(q.x+1)/2*W,y:(1-q.y)/2*Hh};});
  let svg='';for(const side of [0,1]){const col=pts.filter(p=>(p.x>=cx)===!!side).sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=25;
   col.forEach(p=>{p.ly=Math.max(p.y,prev+gap);prev=p.ly;});const over=col.length?col[col.length-1].ly-(Hh-16):0;if(over>0)col.forEach(p=>p.ly-=over);
   col.forEach(p=>{const el=p.L.el,w=el.offsetWidth;if(side){el.style.right='12px';el.style.left='';}else{el.style.left='12px';el.style.right='';}el.style.top=p.ly+'px';
    const colX=side?W-12-w:12+w;const ex=side?colX-2:colX+2,el2=side?colX-14:colX+14;svg+=`<polyline points="${ex},${p.ly} ${el2},${p.ly} ${p.x},${p.y}" fill="none" stroke="#23292b" stroke-width="1.2"/><circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#c8463a" stroke="#23292b" stroke-width="1"/>`;});}
  ln.innerHTML=svg;}}
