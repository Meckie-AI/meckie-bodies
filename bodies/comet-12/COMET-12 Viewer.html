<script type="module">

const mat={

mat.teal.side=THREE.DoubleSide;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(p,name,geo,m,pos=[0,0,0],rot=[0,0,0],sc){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(...pos);o.rotation.set(...rot);if(sc)o.scale.set(...sc);p.add(o);return o;}
function grp(p,name,label,ex){const g=new THREE.Group();g.name=name;g.userData={label,ex};p.add(g);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CZ=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateX(Math.PI/2);
const CX=(r,t,s=32)=>new THREE.CylinderGeometry(r,r,t,s).rotateZ(Math.PI/2);
function linkGeo(L,r1,r2,t,holes=0){
 const s=new THREE.Shape();
 s.moveTo(0,r1);s.absarc(0,0,r1,Math.PI/2,Math.PI*1.5,false);s.lineTo(L,-r2);s.absarc(L,0,r2,-Math.PI/2,Math.PI/2,false);s.lineTo(0,r1);
 for(let i=1;i<=holes;i++){const x=L*i/(holes+1),rr=(r1+(r2-r1)*x/L)*0.5;const h=new THREE.Path();h.absarc(x,0,rr,0,Math.PI*2,true);s.holes.push(h);}
 const d=t-0.002;const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:0.001,bevelSize:0.0008,bevelSegments:2,curveSegments:24});
 g.translate(0,0,-d/2);return g;}
function link(p,name,m,a,b,z,r1,r2,t,holes){const L=Math.hypot(b[0]-a[0],b[1]-a[1]);return add(p,name,linkGeo(L,r1,r2,t,holes),m,[a[0],a[1],z],[0,0,Math.atan2(b[1]-a[1],b[0]-a[0])]);}
function rod(p,name,m,a,b,r){const A=V(...a),B=V(...b),d=B.clone().sub(A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),12),m);o.name=name;o.position.copy(A).add(B).multiplyScalar(0.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());p.add(o);return o;}
function bearing(p,name,pos,ro,ri,w,ax='z'){const g=ax==='z'?CZ:CX;add(p,name+'_race',g(ro,w),mat.steel,pos);add(p,name+'_bore',g(ri,w+0.0006,20),mat.servo15,pos);}

const model=new THREE.Group();model.name='COMET-12';

const body=new THREE.Group();body.name='body_shell';model.add(body);
const R=0.062,XF=0.185,XR=0.18,XT=0.172,CY=0.228,SY=0.8;
const rad=x=>x>=0?R*Math.pow(Math.max(0,1-Math.pow(x/XF,3)),1/3):R*Math.pow(Math.max(0,1-Math.pow(-x/XR,2.4)),1/2.4);
const prof=(x0,x1,k,n)=>{const p=[];for(let i=0;i<=n;i++){const u=i/n,x=x0+(x1-x0)*(0.5-0.5*Math.cos(Math.PI*u));p.push(new THREE.Vector2(rad(x)*k,x));}return p;};

for(const bx of [-0.045,0.045])add(body,'chrome_band_'+(bx>0?'f':'r'),new THREE.TorusGeometry(rad(bx)+0.0004,0.0024,12,72).rotateY(Math.PI/2),mat.chrome,[bx,CY,0],[0,0,0],[1,SY,1]);
add(body,'face_bezel',new THREE.TorusGeometry(0.0245,0.004,16,64).rotateY(Math.PI/2),mat.red,[XT+0.001,CY,0]);

{const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(-0.055,0);s.quadraticCurveTo(-0.07,0.02,-0.082,0.046);s.lineTo(-0.068,0.046);s.quadraticCurveTo(-0.03,0.012,0,0);
 const g=new THREE.ExtrudeGeometry(s,{depth:0.002,bevelEnabled:true,bevelThickness:0.001,bevelSize:0.001,bevelSegments:2});g.translate(0,0,-0.001);
 add(body,'tail_fin',g,mat.red,[-0.105,0.262,0]);}

add(body,'antenna_orbit',new THREE.TorusGeometry(0.0105,0.0008,8,48),mat.chrome,[0.1076,0.3184,0],[1.1,0.4,0]);

add(body,'switch_lever',new THREE.CylinderGeometry(0.0013,0.0018,0.014,10),mat.red,[-0.097,0.277,0.02],[0,0,0.3]);

// ---------- internals ----------

lab(add(IN,'main_switch_body',BX(0.012,0.008,0.008),mat.servo15,[-0.095,0.262,0.02]),'Main switch');
// sensors
add(IN,'camera_housing',CX(0.0068,0.012),mat.chrome,[0.16,0.262,0.0095],[0,0,-0.17]);
add(IN,'tof_housing',CX(0.0068,0.012),mat.chrome,[0.16,0.262,-0.0095],[0,0,-0.08]);
lab(add(IN,'tof_window',BX(0.003,0.006,0.008),mat.glass,[0.1663,0.2615,-0.0095],[0,0,-0.08]),'Front depth · VL53L8CX 8×8 ToF');
add(IN,'tof_ring',new THREE.TorusGeometry(0.0055,0.0011,8,32).rotateY(Math.PI/2),mat.red,[0.1662,0.2615,-0.0095],[0,0,-0.08]);
lab(add(IN,'camera_lens',CX(0.0045,0.003),mat.glass,[0.1663,0.261,0.0095],[0,0,-0.17]),'Camera · Pi Camera Module 3');
add(IN,'camera_pcb',BX(0.003,0.024,0.025),mat.pcb,[0.15,0.25,0.006]);
const cliff=[[0.145,0.1915,0.022],[0.145,0.1915,-0.022],[-0.14,0.1955,0.02],[-0.14,0.1955,-0.02]];
cliff.forEach((q,i)=>{const o=add(IN,'cliff_tof_'+i,new THREE.CylinderGeometry(0.0045,0.0045,0.003,24),mat.glass,q);add(IN,'cliff_ring_'+i,new THREE.TorusGeometry(0.0055,0.0013,8,32).rotateX(Math.PI/2),mat.red,[q[0],q[1]-0.0005,q[2]]);if(i===0)lab(o,'Drop-off ToF ×2 · chin');if(i===2)lab(o,'Drop-off ToF ×2 · rear');});

for(const gz of [-0.006,0,0.006])add(IN,'grille_bar',BX(0.022,0.0016,0.0016),mat.chrome,[0.088,0.2768,gz],[0,0,-0.2]);

lab(add(IN,'charger_pcb',BX(0.024,0.004,0.02),mat.pcb,[-0.12,0.232,-0.022]),'USB-C PD charger · BQ25798');
[0.0205,-0.0205].forEach((mz,i)=>{add(IN,'mic_port_'+i,new THREE.TorusGeometry(0.0022,0.0008,8,24).rotateY(Math.PI/2),mat.chrome,[0.1655,0.2525,mz],[0,0,-0.12]);const o=add(IN,'mic_pcb_'+i,BX(0.002,0.009,0.009),mat.pcb,[0.158,0.2525,mz]);if(!i)lab(o,'Mic ×2 · ICS-43434 I²S MEMS');});

// ---------- legs ----------
const legs=[];
function buildLeg(id,e,s){
 const leg=new THREE.Group();leg.name='leg_'+id;model.add(leg);legs.push(leg);
 const hx=e*0.105,hy=0.19,th=34.4*Math.PI/180,l=0.115;
 const H=[hx,hy],K=[hx-l*Math.sin(th),hy-l*Math.cos(th)],F=[K[0]+l*Math.sin(th),K[1]-l*Math.cos(th)];
 const fr=1-0.015/l,Fc=[K[0]+(F[0]-K[0])*fr,K[1]+(F[1]-K[1])*fr];
 const Mid=[H[0]+(K[0]-H[0])*0.45,H[1]+(K[1]-H[1])*0.45];
 const N=[hx+e*0.021,0.217],c=[0.018*Math.cos(th),0.018*Math.sin(th)];
 const A=[N[0]+c[0],N[1]+c[1]],Bp=[K[0]+c[0]*23/18,K[1]+c[1]*23/18];
 const z=v=>v*s,X=v=>v*e,ang=Math.atan2(K[1]-H[1],K[0]-H[0]);
 const G=(n,label,ex)=>grp(leg,id+'_'+n,label,[ex[0]*e*1.3,ex[1]*1.4,ex[2]*s*1.3]);
 const abd=G('abd_servo','STS3215 · hip abduction',[0,0,-0.085]);
 add(abd,id+'_abd_case',BX(0.035,0.025,0.045),mat.servo15,[X(0.0675),0.2035,z(0.04)]);
 add(abd,id+'_abd_spline',CX(0.0045,0.002),mat.steel,[X(0.0855),0.2035,z(0.052)]);
 const abh=G('abd_horn',null,[0.014,0,-0.085]);add(abh,id+'_abd_horn',CX(0.011,0.003),mat.chrome,[X(0.0868),0.2035,z(0.052)]);
 const abb=G('abd_brg','6701ZZ · abduction idler',[-0.016,0,-0.085]);bearing(abb,id+'_abd_brg',[X(0.046),0.2035,z(0.052)],0.009,0.006,0.004,'x');
 const br=G('bracket','Hip bracket · PLA',[0,0,0]);
 add(br,id+'_br_front',BX(0.004,0.054,0.046),mat.chassis,[X(0.09),0.205,z(0.057)]);
 add(br,id+'_br_rear',BX(0.004,0.04,0.028),mat.chassis,[X(0.046),0.21,z(0.052)]);
 add(br,id+'_br_bridge',BX(0.044,0.004,0.016),mat.chassis,[X(0.068),0.23,z(0.052)]);
 add(br,id+'_br_end',BX(0.004,0.054,0.035),mat.chassis,[X(0.1405),0.205,z(0.0625)]);
 add(br,id+'_br_inner',BX(0.0525,0.028,0.003),mat.chassis,[X(0.1155),0.218,z(0.0425)]);
 add(br,id+'_br_top',BX(0.0525,0.003,0.035),mat.chassis,[X(0.1155),0.2315,z(0.0625)]);
 const kib=G('k_idler',null,[0,0,-0.02]);bearing(kib,id+'_kservo_brg',[N[0],N[1],z(0.0405)],0.009,0.006,0.004);
 const ps=G('pitch_servo','STS3215 · hip pitch',[0,-0.02,0.05]);
 add(ps,id+'_pitch_case',BX(0.045,0.025,0.035),mat.servo15,[X(0.1155),0.19,z(0.0625)]);
 add(ps,id+'_pitch_spline',CZ(0.0045,0.002),mat.steel,[hx,0.19,z(0.081)]);
 const ks=G('knee_servo','STS3215 · knee drive (at hip)',[0,0.028,0.05]);
 add(ks,id+'_knee_case',BX(0.045,0.025,0.035),mat.servo15,[X(0.1155),0.217,z(0.0625)]);
 add(ks,id+'_knee_spline',CZ(0.0045,0.002),mat.steel,[N[0],N[1],z(0.081)]);
 const ph=G('p_horn','Al horn · 25T (×3 per leg)',[0,-0.02,0.075]);add(ph,id+'_pitch_horn',CZ(0.011,0.003),mat.chrome,[hx,0.19,z(0.0835)]);

buildLeg('FR',1,1);buildLeg('FL',1,-1);buildLeg('RR',-1,1);buildLeg('RL',-1,-1);

// ---------- views ----------
const VIEWS={
 side:{dir:[0,0.03,1],fov:16,label:'Side',pad:1.2},
 front:{dir:[1,0.03,0],fov:16,label:'Front',pad:1.2},
 top:{dir:[0,1,0.002],fov:16,label:'Top',pad:1.2},
 iso:{dir:[1,0.55,1.25],fov:24,label:'3/4'},
 rear:{dir:[-1,0.25,0.35],fov:16,label:'Rear',pad:1.2},
 exploded:{dir:[0.85,0.5,0.8],fov:24,only:'leg_FR',labels:true,pad:1.05,label:'Exploded leg'},
 xray:{dir:[0.35,1.0,0.75],fov:24,labels:true,pad:1.05,label:'X-ray body'},
};
const cam=stage._camera,ctl=stage._controls;
if(embed)ctl.enableZoom=false;
let labels=[];
const ov=document.getElementById('ov'),ln=document.getElementById('ln');
function apply(v){
 view=VIEWS[v]?v:'iso';const cfg=VIEWS[view],ex=view==='exploded',xr=view==='xray';
 for(const L of legs){L.visible=!cfg.only||L.name===cfg.only;L.traverse(o=>{const e=o.userData&&o.userData.ex;if(e)o.position.set(ex?e[0]:0,ex?e[1]:0,ex?e[2]:0);});}
 body.visible=!ex;IN.visible=!ex;
 for(const m of [mat.shell,mat.teal]){m.transparent=xr;m.opacity=xr?0.13:1;m.depthWrite=!xr;m.needsUpdate=true;}
 model.updateMatrixWorld(true);
 const box=new THREE.Box3();model.traverseVisible(o=>{if(o.isMesh)box.expandByObject(o);});
 const c=box.getCenter(V()),dir=V(...cfg.dir).normalize(),fwd=dir.clone().negate();
 const right=V().crossVectors(fwd,V(0,1,0)).normalize(),up=V().crossVectors(right,fwd);
 cam.fov=cfg.fov;const tV=Math.tan(cam.fov*Math.PI/360),tH=tV*cam.aspect*(cfg.labels?Math.max(0.42,1-440/innerWidth):1);
 let d=0;for(let i=0;i<8;i++){const p=V(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).sub(c);const w=p.dot(dir);d=Math.max(d,w+Math.abs(p.dot(right))/tH,w+Math.abs(p.dot(up))/tV);}
 d*=(cfg.pad||1.12);
 cam.position.copy(c).addScaledVector(dir,d);cam.near=d/60;cam.far=d*30;cam.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 ov.innerHTML='';ln.innerHTML='';labels=[];
 if(cfg.labels){const src=ex?legs.find(L=>L.name===cfg.only):IN;let n=0;
  src.traverse(o=>{if(o.userData&&o.userData.label&&o!==src){n++;const b=new THREE.Box3().setFromObject(o);const el=document.createElement('div');el.className='lb';el.innerHTML='<b>'+String(n).padStart(2,'0')+'</b>'+o.userData.label;ov.appendChild(el);labels.push({p:b.getCenter(V()),el});}});}
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}
const bar=document.getElementById('bar');
for(const k in VIEWS){const b=document.createElement('button');b.textContent=VIEWS[k].label;b.dataset.v=k;b.onclick=()=>apply(k);bar.appendChild(b);}
function layout(){
 if(labels.length){const W=innerWidth,Hh=innerHeight,cx=W/2;const pts=labels.map(L=>{const q=L.p.clone().project(cam);return {L,x:(q.x+1)/2*W,y:(1-q.y)/2*Hh};});
  let svg='';for(const side of [0,1]){const col=pts.filter(p=>(p.x>=cx)===!!side).sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=25;
   col.forEach(p=>{p.ly=Math.max(p.y,prev+gap);prev=p.ly;});const over=col.length?col[col.length-1].ly-(Hh-16):0;if(over>0)col.forEach(p=>p.ly-=over);
   col.forEach(p=>{const el=p.L.el,w=el.offsetWidth;if(side){el.style.right='12px';el.style.left='';}else{el.style.left='12px';el.style.right='';}el.style.top=p.ly+'px';
    const colX=side?W-12-w:12+w;const ex=side?colX-2:colX+2,el2=side?colX-14:colX+14;svg+=`<polyline points="${ex},${p.ly} ${el2},${p.ly} ${p.x},${p.y}" fill="none" stroke="#23292b" stroke-width="1.2"/><circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#c8463a" stroke="#23292b" stroke-width="1"/>`;});}
  ln.innerHTML=svg;}}
function tick(){layout();requestAnimationFrame(tick);}
window.comet={apply:v=>{apply(v);stage._renderer.render(stage._scene,cam);layout();}};
apply(view);stage._renderer.render(stage._scene,cam);layout();tick();
new ResizeObserver(()=>setTimeout(()=>apply(view),30)).observe(stage);
